<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call UHQ - Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            z-index: 1;
            padding: 40px;
            max-width: 600px;
        }

        .logo-section {
            margin-bottom: 60px;
        }

        h1 {
            font-size: 3.5em;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ffffff 0%, #cccccc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.3em;
            color: #b0b0b0;
            margin-bottom: 40px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .coming-soon {
            display: inline-block;
            padding: 15px 40px;
            border: 2px solid #ffffff;
            color: #ffffff;
            font-size: 1.1em;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            margin-bottom: 80px;
            cursor: default;
        }

        .coming-soon:hover {
            background-color: #ffffff;
            color: #000000;
            box-shadow: 0 10px 40px rgba(255, 255, 255, 0.2);
        }

        .footer {
            position: absolute;
            bottom: 40px;
            left: 0;
            right: 0;
            text-align: center;
            color: #666666;
            font-size: 0.95em;
            letter-spacing: 0.5px;
        }

        .made-by {
            font-weight: 500;
            color: #888888;
            margin-top: 20px;
        }

        .creators {
            color: #ffffff;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Subtle animated background effect */
        .background-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, transparent 70%);
            border-radius: 50%;
            top: -100px;
            left: -100px;
            animation: float 20s ease-in-out infinite;
        }

        .background-glow-2 {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.03) 0%, transparent 70%);
            border-radius: 50%;
            bottom: -50px;
            right: -50px;
            animation: float-reverse 25s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 30px); }
        }

        @keyframes float-reverse {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-30px, -30px); }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5em;
                letter-spacing: 1px;
            }

            .subtitle {
                font-size: 1.1em;
            }

            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="background-glow"></div>
    <div class="background-glow-2"></div>

    <div class="container">
        <div class="logo-section">
            <h1>CALL UHQ</h1>
            <p class="subtitle">Ouverture bientôt</p>
            <div class="coming-soon">COMING SOON</div>
        </div>
    </div>

    <div class="footer">
        <div class="made-by">
            Made by <span class="creators">zeleph × clip1x</span>
        </div>
    </div>
</body>
</html>
